<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Long Life Clinic Management USA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy sidebar + work area; patient list on the left of the work area, patient record on the right; forms in a modal sheet */
:root{
  --navy:#0B2557; --royal:#1F4E9E; --gold:#E9AE16;
  --bg:#EEF4FA; --surface:#FFFFFF; --surface2:#F5F9FD; --fg:#0B2557; --muted:#50638A; --line:#D3E2EF;
  --accent:#1F4E9E; --onaccent:#FFFFFF; --ok:#1E7A52; --okbg:#DDF1E6; --warn:#8A5A00; --warnbg:#FBF0CC; --bad:#A22E1F; --badbg:#F8D9D3;
  --side:#0B2557; --sidefg:#C9DBF2;
  --display:"Libre Baskerville",Georgia,serif; --body:"Montserrat","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06142f; --surface:#0c2350; --surface2:#0f2a5c; --fg:#EAF3FB; --muted:#A3B9D8; --line:#1f3d72;
  --accent:#86ABEE; --onaccent:#06142f; --ok:#79D6AA; --okbg:#123d2c; --warn:#F2C766; --warnbg:#3a2f0b; --bad:#F29B8C; --badbg:#4a1a14;
  --side:#040e22; --sidefg:#A3B9D8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06142f; --surface:#0c2350; --surface2:#0f2a5c; --fg:#EAF3FB; --muted:#A3B9D8; --line:#1f3d72;
  --accent:#86ABEE; --onaccent:#06142f; --ok:#79D6AA; --okbg:#123d2c; --warn:#F2C766; --warnbg:#3a2f0b; --bad:#F29B8C; --badbg:#4a1a14;
  --side:#040e22; --sidefg:#A3B9D8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside.side{background:var(--side);color:var(--sidefg);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.logo{font-family:var(--display);color:#fff;font-size:1.05rem;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.logo small{display:block;font-family:var(--body);font-size:.66rem;letter-spacing:.2em;color:var(--gold);font-weight:700}
.nav{background:none;border:0;text-align:left;color:var(--sidefg);padding:9px 10px;border-radius:8px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav[aria-current="true"]{background:rgba(255,255,255,.1);color:#fff}
.nav .b{background:var(--gold);color:#0B2557;border-radius:999px;font-size:.7rem;padding:0 7px;min-width:20px;text-align:center}
.side .foot{margin-top:auto;font-size:.72rem;opacity:.8;padding:8px}
main{padding:24px 28px;min-width:0}
h1{font-family:var(--display);font-size:1.45rem;margin:0}
h2{font-size:1rem;margin:0}
h3{font-size:.8rem;margin:0;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top p{color:var(--muted);margin:2px 0 0}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--onaccent);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.btn.gold{background:var(--gold);color:#0B2557}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn.wa{background:#1E7A52;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.rowbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 0;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:8px}.rowbtn:hover{background:var(--surface2)}.rowbtn .grow{display:flex;flex-direction:column;min-width:0}.rowbtn .pill{flex:none;min-width:130px;text-align:center}.rowbtn .s{color:var(--muted);font-size:.85rem}.kbtn{text-align:left;cursor:pointer;color:inherit;font:inherit}.kbtn:hover{border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.8rem;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel>h2{margin-bottom:10px}
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dia{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.dia.hoje{border:2px solid var(--gold);background:var(--warnbg)}
.dia.atr{border:2px solid var(--bad);background:var(--badbg)}
.dia .dd{font-family:var(--display,serif);font-size:1.5rem;font-weight:700;line-height:1;color:var(--accent)}
.dia .dm{font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.dia ul{list-style:none;margin:8px 0 0;padding:0;font-size:.82rem}
.dia li{padding:3px 0;border-top:1px dashed var(--line)}
.dia li b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border-radius:10px;padding:6px 10px;font-size:.8rem;font-weight:700;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.feita{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.prox{background:var(--gold);color:#0B2557;border-color:transparent}
.chip.atr{background:var(--badbg);color:var(--bad);border-color:transparent}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:.8rem}
.alerta{display:inline-block;background:#c0392b;color:#fff;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}
.alerta-box{background:#fdecea;border:1px solid #c0392b;color:#7a1f16;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem}
@media (prefers-color-scheme: dark){.alerta-box{background:#3a1a17;color:#ffb4a8}}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;white-space:nowrap;text-decoration:none}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)} .p-info{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)} .p-mute{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list input{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 14px;background:var(--surface)}
.pi{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;cursor:pointer}
.pi:first-of-type{border-top:0}
.pi[aria-current="true"]{background:var(--surface2);box-shadow:inset 3px 0 0 var(--gold)}
.pi .t{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.pi .s{color:var(--muted);font-size:.78rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px;overflow-x:auto}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}.dots i.on{background:var(--ok);border-color:var(--ok)}
.tab{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--gold)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{background:var(--surface2);border-radius:10px;padding:10px 12px}
.fact span{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.fact b{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
td .x{background:none;border:0;color:var(--muted);cursor:pointer}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.msgbox{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:.88rem}
.scrim{position:fixed;inset:0;background:rgba(3,10,25,.55);z-index:40;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.sheet h2{font-family:var(--display);font-size:1.15rem;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
label.f.full{grid-column:1/-1}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:.9rem;color:var(--fg)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.note{background:var(--warnbg);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.82rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;z-index:60}
.err{color:var(--bad);font-size:.82rem}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.col h2{display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.card .t{font-weight:700}
.card .s{color:var(--muted);font-size:.78rem}
.card select{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:.8rem}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.8rem;cursor:pointer;color:var(--fg)}
.fbtn[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:transparent}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .d{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.tl .k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:8px 0 0;border-bottom:1px solid var(--line)}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars .b i{display:block;width:min(46px,100%);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars .b:hover i{background:var(--gold)}
.bars .b small{font-size:.72rem;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.blab{display:flex;gap:10px}.blab span{flex:1;text-align:center;font-size:.72rem;color:var(--muted);padding-top:4px}
.finbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:0 0 16px}
.mnav{display:flex;align-items:center;gap:8px}.mnav b{font-size:1.05rem;min-width:9.5em;text-align:center}
.fsel{display:flex;flex-direction:column;font-size:.75rem;font-weight:700;color:var(--muted);gap:3px}.fsel select{min-width:150px;max-width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:.88rem;font-weight:600}
.prog{height:6px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.parc .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}.parc .row:last-child{border-bottom:0}
.dd2{width:42px;text-align:center;background:var(--surface2);border-radius:8px;padding:4px 0;line-height:1.1}.dd2 b{display:block;font-size:1.05rem}.dd2 small{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.parc .val{font-variant-numeric:tabular-nums}.parc .ra{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-left:52px}
.lg{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin:2px 0 8px}.lg span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}.sw-p{background:var(--ok)}.sw-a{background:var(--accent)}
.fc{display:flex;flex-direction:column;gap:6px}.fcr{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:none;border:1px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;color:var(--fg);font:inherit;text-align:left}
.fcr:hover,.fcr.on{background:var(--surface2);border-color:var(--line)}.fm{font-weight:700;font-size:.82rem;text-transform:capitalize}
.fb{display:flex;gap:2px;height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}.fb i{display:block;height:100%;border-radius:4px}
.fv{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;text-align:right}.fv small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.sep{width:1px;background:var(--line);margin:0 4px}
.ag-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal-h span{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 6px;letter-spacing:.05em}
.cd{min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);overflow:hidden}
.cd.vazio{border:0;background:none;cursor:default}.cd.pass{background:var(--surface2)}.cd:hover{border-color:var(--accent)}
.cd.hj{border:2px solid var(--gold)}.cd.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}.cd.at .cn{color:var(--bad)}
.cn{font-weight:800;font-size:.85rem}.cl{display:flex;flex-direction:column;gap:2px}.cm{display:none}
.ci{font-size:.68rem;font-weight:600;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-pr{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}.c-ok{background:var(--okbg);color:var(--ok)}.c-atr{background:var(--badbg);color:var(--bad)}.c-mais{color:var(--muted)}
.sw-pr{background:var(--accent)}.sw-ok{background:var(--ok)}.sw-atr{background:var(--bad)}
.cm i{font-style:normal;font-size:.68rem;font-weight:800;border-radius:99px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.b-pr{background:var(--accent);color:var(--onaccent)}.b-ok{background:var(--ok);color:var(--surface)}.b-atr{background:var(--bad)}
.kp2{display:flex;gap:10px;margin:4px 0 10px}.kp2 div{flex:1;background:var(--surface2);border-radius:10px;padding:8px 10px}.kp2 b{display:block;font-size:1.3rem}.kp2 span{font-size:.75rem;color:var(--muted)}
.ag-t{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}
.ag-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.ag-row .grow{min-width:140px}.ag-h{font-variant-numeric:tabular-nums;font-weight:800;font-size:.85rem;min-width:44px}
.ag-ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.ag-ok .t{color:var(--ok)}.ag-atr{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
@media (max-width:1100px){.ag-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.cd{min-height:54px;align-items:center;padding:4px 2px}.cl{display:none}.cm{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.cal-h,.cal-g{gap:3px}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.split{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}aside.side{flex-direction:row;overflow-x:auto;padding:10px 16px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}.logo,.side .foot{display:none}main{padding:16px}.grid2{grid-template-columns:1fr}}
</style>

<body>

<div class="app">
  <aside class="side">
    <div class="logo">Long Life<small>CLINIC MANAGEMENT</small></div>
    <button class="nav" data-view="painel" aria-current="true">Dashboard</button>
    <button class="nav" data-view="funil">Funnel</button>
    <button class="nav" data-view="pacientes">Patients</button>
    <button class="nav" data-view="consultas">Appointments <span class="b" id="bCon" hidden></span></button>
    <button class="nav" data-view="aplicacoes">Injections <span class="b" id="bApl" hidden></span></button>
    <button class="nav" data-view="financeiro">Billing <span class="b" id="bPag" hidden></span></button>
    <button class="nav" data-view="indicacoes">Referrals</button>
    <button class="nav" data-view="whatsapp">WhatsApp <span class="b" id="bWa" hidden></span></button>
    <button class="nav" data-view="relatorios">Reports</button>
    <div class="foot" id="conn">Connecting…</div>
  </aside>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<div id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const BUILD_LANG='en';
const FREQ={Weekly:7,Biweekly:14,Monthly:30,Custom:null};
const passo=p=>p.frequencia==="Custom"?Math.max(1,+p.intervalo||6):(FREQ[p.frequencia]||7);
const freqTxt=p=>p.frequencia==="Custom"?"Every "+passo(p)+" days":(p.frequencia||"Weekly");
const ETAPAS=["Lead","Under evaluation","Active","Paused","Completed"];
const ORIGENS=["Referral","Instagram","Facebook","Google","Website","WhatsApp","Tally intake","Tally progress","Other"];
const PERIODO={Weekly:7,Biweekly:14,Monthly:"m"};
const TIPOS=["medida","dose","aplicacao","pagamento","consulta","nota","indicacao"];
const S={db:null,canWrite:true,pac:[],ev:[],evBy:{},view:"painel",sel:null,tab:"evolucao",q:"",fin:"todos",ready:false,err:"",synced:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5);

function info(p){
  const apl=evOf(p.id,"aplicacao"),doses=evOf(p.id,"dose"),med=evOf(p.id,"medida"),pag=evOf(p.id,"pagamento");
  const last=apl[apl.length-1];const step=passo(p);
  const prox=last?addDays(last.data,step):(p.inicio||today());
  const atraso=diffDays(today(),prox);
  const pesoAtual=med.length?+med[med.length-1].peso:+p.pesoInicial;
  const doseAtual=doses.length?doses[doses.length-1]:null;
  const aberto=pag.filter(x=>x.status!=="pago"),avencer=aberto.filter(aVencer),pend=aberto.filter(x=>!aVencer(x));const vencido=pend.some(x=>x.vencimento&&x.vencimento<today());
  let st="ok",stT="On track";
  if(p.status&&p.status!=="Active"){st=p.status==="Lead"||p.status==="Under evaluation"?"info":"mute";stT=p.status}
  else if(atraso>1||vencido){st="bad";stT=atraso>1?"Injection overdue":"Payment overdue"}
  else if(atraso>=0||pend.length){st="warn";stT=atraso>=0?"Injection today":"Payment pending"}
  const semanas=p.inicio?Math.max(0,Math.floor(diffDays(today(),p.inicio)/7)+1):0;
  return {apl,doses,med,pag,last,prox,atraso,pesoAtual,doseAtual,pend,aberto,avencer,vencido,st,stT,semanas,
    perda:p.pesoInicial&&pesoAtual?(pesoAtual-p.pesoInicial):null};
}

function ciclo(p,i=info(p)){
  const n=CICLO_N,apl=i.apl,tot=apl.length,k=Math.max(1,Math.ceil(tot/n)),feitas=tot-n*(k-1);
  const parc=i.pag.filter(e=>e.plano&&!e.saldoDe).sort((a,b)=>(a.vencimento||"").localeCompare(b.vencimento||""));
  const abertosAnt=[];for(let j=1;j<k;j++){const q=parc[j-1];if(q&&q.status!=="pago")abertosAnt.push({j,q})}
  const q=parc[k-1]||null,pago=q?q.status==="pago":false,completo=feitas>=n;
  return {n,k,feitas,tot,apps:apl.slice(n*(k-1),n*k),parc:q,pago,completo,abertosAnt,faltam:Math.max(0,n-feitas)}
}

  if(e.plano&&n&&!/installment/.test(t)){const k=parcelasPlano(p).findIndex(x=>x.d===(e.vencimento||"").slice(0,10));if(k>=0)t+=` · installment ${k+1}/${n}`}return t}
const planoTxt=p=>temPlano(p)?`${p.planoPeriodo} · ${eur(p.planoValor)}${+p.planoParcelas?` · ${p.planoParcelas}x`:""}`:"No plan";

const HORIZ=12;// months generated ahead on a continuous plan
function parcelasPlano(p){const r=[];if(!temPlano(p))return r;const n=+p.planoParcelas||0,lim=addMonths(today(),HORIZ);
  for(let k=0;k<(n||500);k++){const d=vencPlano(p,k);if(!n&&d>lim)break;r.push({d,k})}return r}
const IND_VALOR=50;// referral discount, applied only to the month's installment
const r2=n=>Math.round(n*100)/100;
const indicacoesMes=(pid,mes)=>S.ev.filter(e=>e.tipo==="indicacao"&&e.pacienteId===pid&&e.mes===mes);
function descontoPlano(pid,venc,base){const n=indicacoesMes(pid,venc.slice(0,7)).length,desc=Math.min(base,n*IND_VALOR);return{n,desc,valor:r2(base-desc)}}
const parcelaDoMes=(pid,mes)=>S.ev.filter(e=>e.pacienteId===pid&&e.tipo==="pagamento"&&e.plano&&!e.saldoDe&&(e.vencimento||"").startsWith(mes)).sort((a,b)=>a.vencimento.localeCompare(b.vencimento))[0];
const valTxt=e=>eur(e.valor)+(+e.desconto?` <small style="color:var(--ok)">−${eur(e.desconto)} referrals</small>`:"");
async function recalcParcela(par,n){// reapply n referrals to the installment (base = value before discount)
  const base=+par.valorBase||+par.valor,desc=Math.min(base,n*IND_VALOR),valor=r2(base-desc),zero=valor<=0;
  const d={valor,valorBase:base,desconto:desc};
  if(zero){d.status="pago";d.data=today();d.metodo="Referral discount"}
  else if(par.status==="pago"&&par.metodo==="Referral discount"){d.status="pendente";d.data="";d.metodo=par.metodoOriginal||""}
  if(zero&&par.metodo!=="Referral discount")d.metodoOriginal=par.metodo||"";
  if(!desc){d.valorBase=null;d.desconto=0}
  await wr(()=>S.db.doc("eventos/"+par.id).update(d));
}
async function syncPlano(p,ign=new Set()){
  if(!S.canWrite||!temPlano(p)||(p.status&&p.status!=="Active"))return 0;
  const ate=p.planoGeradoAte||"",n=+p.planoParcelas||0;const novos=parcelasPlano(p).filter(x=>x.d>ate);
  if(!novos.length)return 0;let c=0;
  for(const {d,k} of novos){const id=`plano_${p.id}_${d}`;if(S.ev.some(e=>!ign.has(e.id)&&(e.id===id||(e.tipo==="pagamento"&&e.pacienteId===p.id&&e.vencimento===d))))continue;
    const dc=descontoPlano(p.id,d,+p.planoValor);
    await wr(()=>S.db.doc("eventos/"+id).set({pacienteId:p.id,tipo:"pagamento",descricao:`${p.planoDescricao||"Follow-up"} (${p.planoPeriodo.toLowerCase()})${n?` · installment ${k+1}/${n}`:""}`,valor:dc.valor,metodo:p.planoMetodo||"",status:"pendente",vencimento:d,data:"",plano:true,...(n?{parcela:k+1,parcelas:n}:{}),...(dc.desc?{valorBase:+p.planoValor,desconto:dc.desc,...(dc.valor<=0?{status:"pago",data:today(),metodo:"Referral discount",metodoOriginal:p.planoMetodo||""}:{})}:{}),criadoEm:new Date().toISOString()}));c++;await sleep(120)}
  await wr(()=>S.db.doc("pacientes/"+p.id).update({planoGeradoAte:novos[novos.length-1].d}));
  return c;
}

function tabela(rows,cols,empty){
  if(!rows.length)return `<p class="empty">${empty}</p>`;
  const del=S.canWrite;
  return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}${del?"<th></th>":""}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}${del?`<td><button class="x" data-del="${r.id}" aria-label="Delete record" title="Delete">✕</button></td>`:""}</tr>`).join("")}</tbody></table></div>`;
}

function chart(p,i){
  const pts=[...(p.pesoInicial&&p.inicio?[{d:p.inicio,v:+p.pesoInicial}]:[]),...i.med.filter(m=>m.peso).map(m=>({d:m.data,v:+m.peso}))].sort((a,b)=>a.d.localeCompare(b.d));
  if(pts.length<2)return `<h3>Weight</h3><p class="empty">Add at least one measurement to see the curve.</p>`;
  const W=640,H=200,L=44,R=14,T=14,B=26;
  const d0=pts[0].d,span=Math.max(1,diffDays(pts[pts.length-1].d,d0));
  const vals=pts.map(x=>x.v).concat(p.meta?[+p.meta]:[]);let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const x=d=>L+(W-L-R)*diffDays(d,d0)/span,y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  const path=pts.map((q,k)=>(k?"L":"M")+x(q.d).toFixed(1)+","+y(q.v).toFixed(1)).join("");
  const last=pts[pts.length-1];
  return `<h3>Weight (kg)</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight curve">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text class="ax" x="${L-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
  ${p.meta?`<line x1="${L}" x2="${W-R}" y1="${y(+p.meta)}" y2="${y(+p.meta)}" stroke="var(--gold)" stroke-dasharray="5 4"/><text class="ax" x="${W-R}" y="${y(+p.meta)-5}" text-anchor="end">goal ${num(p.meta)}</text>`:""}
  <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map(q=>`<circle cx="${x(q.d)}" cy="${y(q.v)}" r="3" fill="var(--accent)"/>`).join("")}
  <circle cx="${x(last.d)}" cy="${y(last.v)}" r="5.5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/>
  <text class="ax" x="${L}" y="${H-6}">${br(d0)}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${br(last.d)}</text>
  </svg>`;
}

async function exportar(tipo="financeiro"){

  const nome=id=>S.pac.find(p=>p.id===id)?.nome||"";
  let rows;
  if(tipo==="pacientes")rows=[["Name","Phone","Email","Stage","Source","Start","Schedule","Starting weight","Current weight","Goal","Prescriber","Plan","Plan amount"]].concat(S.pac.map(p=>{const i=info(p);return[p.nome,p.telefone,p.email,p.status||"Active",p.origem,p.inicio,freqTxt(p),p.pesoInicial,i.pesoAtual,p.meta,p.prescritor,p.planoPeriodo||"",p.planoValor||""]}));

  else rows=[["Patient","Due date","Description","Amount","Method","Paid on","Status"]].concat(S.ev.filter(e=>e.tipo==="pagamento").map(e=>[nome(e.pacienteId),e.vencimento,e.descricao,String(e.valor),e.metodo,e.status==="pago"?e.data:"",stPag(e)[1]]));
  const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");

  try{await dl.save({filename:`${tipo}-${today()}.csv`,data:new Blob(["\ufeff"+csv],{type:"text/csv"})})}catch(_){}
}

function mkDb(){
  const cache={pacientes:new Map(),eventos:new Map()},subs=[];let pend=false;
  const sched=()=>{if(pend)return;pend=true;queueMicrotask(()=>{pend=false;for(const s of subs){const docs=[...cache[s.t].values()].filter(r=>(!FR.filtro||r.franquia_id===FR.filtro)&&(!s.w||r.dados?.[s.w[0]]===s.w[2])).map(r=>({id:r.id,data:()=>({...r.dados,_fr:r.franquia_id})}));try{s.cb({docs})}catch(e){console.error(e)}}})};
  const clean=d=>{const o={...d};delete o._fr;delete o.id;return o};
  const genId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);
  async function put(t,id,dados,isNew){
    const row={id,dados};if(t==="eventos"){row.tipo=dados.tipo;row.paciente_id=dados.pacienteId}
    let q;if(isNew){row.franquia_id=FR.me.franquia_id;q=sb.from(t).insert(row)}else q=sb.from(t).update(row).eq("id",id);
    const{data,error}=await q.select().single();if(error)throw error;cache[t].set(id,data);sched();
  }
  const doc=path=>{const[t,id]=path.split("/");return{id,
    set:d=>put(t,id,clean(d),!cache[t].has(id)),
    update:d=>{const cur=cache[t].get(id);if(!cur)return Promise.reject(new Error("not found"));return put(t,id,{...cur.dados,...clean(d)},false)},
    delete:async()=>{const{error}=await sb.from(t).delete().eq("id",id);if(error)throw error;cache[t].delete(id);sched()}}};
  const query=(t,w)=>({doc:()=>doc(t+"/"+genId()),limit:()=>query(t,w),where:(f,op,v)=>query(t,[f,op,v]),onSnapshot:(cb,er)=>{subs.push({t,w,cb,er});if(loaded)sched()}});
  let loaded=false;
  async function load(){
    for(const t of ["pacientes","eventos"]){for(let from=0;;from+=1000){const{data,error}=await sb.from(t).select("*").range(from,from+999);if(error)throw error;for(const r of data)cache[t].set(r.id,r);if(data.length<1000)break}}
    loaded=true;sched();
    sb.channel("dados").on("postgres_changes",{event:"*",schema:"public",table:"pacientes"},p=>apply("pacientes",p)).on("postgres_changes",{event:"*",schema:"public",table:"eventos"},p=>apply("eventos",p)).subscribe();
  }
  function apply(t,p){if(p.eventType==="DELETE"){if(p.old?.id)cache[t].delete(p.old.id)}else if(p.new?.id)cache[t].set(p.new.id,p.new);sched()}
  return{doc,collection:t=>query(t,null),load,refresh:sched};
}

  $("#uFech").onclick=()=>m.hidden=true;
  m.querySelectorAll("tr[data-fid]").forEach(tr=>{tr.querySelector(".fGuardar").onclick=async()=>{
    const row={nome:tr.querySelector(".fNome").value.trim(),pais:tr.querySelector(".fPais").value.trim().toUpperCase(),moeda:tr.querySelector(".fMoeda").value,idioma:tr.querySelector(".fIdioma").value,ativa:tr.querySelector(".fAtiva").checked};
    if(!row.nome){msg(TX.nome+"?");return}
    const{error}=await sb.from("franquias").update(row).eq("id",tr.dataset.fid);if(error){msg(error.message);return}await recarregaFr();msg(TX.ok)}});
  $("#fNovo").onsubmit=async e=>{e.preventDefault();
    const row={nome:$("#nfNome").value.trim(),pais:$("#nfPais").value.trim().toUpperCase(),moeda:$("#nfMoeda").value,idioma:$("#nfIdioma").value,sede:false};
    const{error}=await sb.from("franquias").insert(row);if(error){msg(error.message);return}await recarregaFr();abrirFr();$("#uMsg").textContent=TX.ok};
}

async function fnUtil(body){const{data,error}=await sb.functions.invoke("utilizadores",{body});if(error){let m=error.message;try{m=(await error.context.json()).erro||m}catch(_){}throw new Error(m)}return data}
async function abrirUtil(){
  let m=$("#umod");if(!m){m=document.createElement("div");m.id="umod";document.body.appendChild(m)}
  m.hidden=false;m.innerHTML=`<div class="box"><p>${TX.carreg}</p></div>`;
  const sede=frById(FR.me.franquia_id)?.sede;
  const papeis=Object.keys(TX.papeis).filter(p=>p!=="gestor"||FR.me.papel==="gestor");
  let lista=[];try{lista=(await fnUtil({acao:"listar"})).utilizadores||[]}catch(e){m.innerHTML=`<div class="box"><p>${esc(e.message)}</p><button class="btn" id="uFech">${TX.fechar}</button></div>`;$("#uFech").onclick=()=>m.hidden=true;return}
  const optP=sel=>Object.keys(TX.papeis).map(p=>`<option value="${p}"${p===sel?" selected":""}${papeis.includes(p)?"":" disabled"}>${TX.papeis[p]}</option>`).join("");
  m.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${TX.util}</h2><button class="btn" id="uFech">${TX.fechar}</button></div>
  <table><thead><tr><th>${TX.nome}</th><th>${TX.email}</th>${sede?`<th>${TX.fr}</th>`:""}<th>${TX.papel}</th><th>${TX.ativo}</th><th></th></tr></thead><tbody>
  ${lista.map(u=>`<tr data-uid="${u.user_id}"><td>${esc(u.nome||"")}</td><td>${esc(u.email||"")}</td>${sede?`<td>${esc(frById(u.franquia_id)?.nome||"")}</td>`:""}
  <td><select class="uPapel"${u.user_id===FR.me.user_id?" disabled":""}>${optP(u.papel)}</select></td><td><input type="checkbox" class="uAtivo"${u.ativo?" checked":""}${u.user_id===FR.me.user_id?" disabled":""} style="width:auto"></td>
  <td><button type="button" class="btn uSenha">${TX.redef}</button></td></tr>`).join("")}</tbody></table>
  <h3>${TX.criar}</h3><form id="uNovo" class="row"><input id="nNome" placeholder="${TX.nome}" required><input id="nEmail" type="email" placeholder="${TX.email}" required><input id="nSenha" type="password" minlength="8" placeholder="${TX.tmp}" required autocomplete="new-password">
  <select id="nPapel">${optP("medico")}</select>${sede?`<select id="nFr">${FR.list.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join("")}</select>`:""}<button class="btn gold">${TX.criar}</button></form><div class="msg" id="uMsg"></div></div>`;
  const msg=t=>$("#uMsg").textContent=t;
  $("#uFech").onclick=()=>m.hidden=true;
  m.querySelectorAll("tr[data-uid]").forEach(tr=>{const uid=tr.dataset.uid;
    tr.querySelector(".uPapel").onchange=async e=>{try{await fnUtil({acao:"atualizar",user_id:uid,papel:e.target.value});msg(TX.ok)}catch(er){msg(er.message)}};
    tr.querySelector(".uAtivo").onchange=async e=>{try{await fnUtil({acao:"atualizar",user_id:uid,ativo:e.target.checked});msg(TX.ok)}catch(er){msg(er.message)}};
    tr.querySelector(".uSenha").onclick=()=>{tr.querySelector(".uSenha").outerHTML=`<form class="uSf" style="display:flex;gap:4px"><input type="password" minlength="8" placeholder="${TX.nova}" required autocomplete="new-password"><button class="btn">OK</button></form>`;
      tr.querySelector(".uSf").onsubmit=async e=>{e.preventDefault();try{await fnUtil({acao:"atualizar",user_id:uid,senha:e.target.querySelector("input").value});msg(TX.ok);abrirUtil()}catch(er){msg(er.message)}}};
  });
  $("#uNovo").onsubmit=async e=>{e.preventDefault();try{await fnUtil({acao:"criar",nome:$("#nNome").value.trim(),email:$("#nEmail").value.trim(),senha:$("#nSenha").value,papel:$("#nPapel").value,franquia_id:sede?$("#nFr").value:FR.me.franquia_id});abrirUtil()}catch(er){msg(er.message)}};
}

(async()=>{
  document.head.insertAdjacentHTML("beforeend",authCss());
  render();
  if(location.hash.includes("type=recovery")){sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")showLogin("nova")})}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){if(!location.hash.includes("type=recovery"))showLogin();$("#conn").textContent="";return}
  const uid=session.user.id;
  const[{data:me},{data:frs}]=await Promise.all([sb.from("perfis").select("*").eq("user_id",uid).maybeSingle(),sb.from("franquias").select("*").order("sede",{ascending:false})]);
  if(!me||!me.ativo){S.err=TX.sem;$("#conn").textContent="";render();showLogin();$("#aMsg").textContent=TX.sem;await sb.auth.signOut();return}
  FR.me={...me,email:session.user.email};FR.list=frs||[];FR.filtro=me.franquia_id;
  const fr=frById(me.franquia_id);FR.moeda=fr?.moeda||FR.moeda;
  if(fr?.sede){let sv=null;try{sv=sessionStorage.getItem("frFiltro")}catch(_){}if(sv==="todas")FR.filtro=null;else if(sv&&frById(sv))FR.filtro=sv}
  const vis=frById(FR.filtro||me.franquia_id);
  const alvo=LANG_FILE[vis?.idioma||"pt"];if(alvo!==LANG_FILE[BUILD_LANG]){location.replace(alvo);return}
  (NAV_OCULTA[me.papel]||[]).forEach(v=>{const b=document.querySelector(`.nav[data-view="${v}"]`);if(b)b.hidden=true});
  const db=mkDb();S.db=db;S.canWrite=FR.filtro===me.franquia_id;FR.moeda=vis?.moeda||FR.moeda;
  $("#conn").textContent=S.canWrite?TX.lig:TX.ro;frBar();
  let gotP=false;const got={};
  const ready=()=>{S.ready=gotP&&TIPOS.every(t=>got[t]);if(S.ready&&!S.synced&&S.canWrite&&FR.me.papel!=="medico"){S.synced=true;syncTodos().then(n=>{if(n)toast(n+" ✓")})}if($("#modal").hidden)render()};
  db.collection("pacientes").limit(1000).onSnapshot(s=>{S.pac=s.docs.map(d=>({id:d.id,...d.data()}));gotP=true;ready()},er=>{S.err="Erro";render()});
  for(const tp of TIPOS)db.collection("eventos").where("tipo","==",tp).limit(1000).onSnapshot(s=>{S.evBy[tp]=s.docs.map(d=>({id:d.id,...d.data()}));S.ev=TIPOS.flatMap(t=>S.evBy[t]||[]);got[tp]=true;ready()},er=>{S.err="Erro";render()});
  try{await db.load()}catch(e){S.err=e.message||"Erro";render()}
})();
</script>
